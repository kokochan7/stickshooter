<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#20242a}canvas{display:block}</style></head>
<body><script type="module">
import * as THREE from 'three';
import { buildGun } from './src/client/gunModels.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || 'knife,knife_tanto,knife_bowie,knife_karambit,knife_dagger').split(',');
const W = 1600, H = 900;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(W, H); r.setPixelRatio(1);
r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a2f37);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x50483e, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const fill = new THREE.DirectionalLight(0xbfd0ff, 0.8); fill.position.set(-3, 1, -2); scene.add(fill);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.01, 10);
const n = ids.length;
ids.forEach((id, i) => {
  const g = buildGun(id).group;
  g.rotation.y = Math.PI / 2; // blade to the right... (−Z → +X)
  g.rotation.y = -Math.PI / 2;
  g.rotation.x = 0;
  g.position.set(0, (n - 1) / 2 * 0.125 - i * 0.125 + 0.01, 0);
  g.rotation.z = 0.0;
  scene.add(g);
});
const names = { knife: 'Current', knife_tanto: 'A · Tactical tanto', knife_bowie: 'B · Frontier bowie', knife_karambit: 'C · Karambit', knife_dagger: 'D · Combat dagger' };
const tilt = +(q.get('tilt') || 0);
scene.children.filter((o) => o.isGroup).forEach((g, i) => { g.rotation.x = tilt; g.position.x = -0.02; });
cam.position.set(0.0, 0.0, 0.66 + (n - 1) * 0.12); cam.lookAt(0, 0, 0);
r.render(scene, cam);
const v = new THREE.Vector3();
scene.children.filter((o) => o.isGroup).forEach((g, i) => {
  v.set(-0.24, g.position.y, 0).project(cam);
  const d = document.createElement('div');
  d.textContent = names[ids[i]] || ids[i];
  d.style.cssText = `position:absolute;left:${(v.x + 1) / 2 * W}px;top:${(1 - v.y) / 2 * H}px;transform:translate(-100%,-50%);color:#e8edf3;font:600 30px system-ui,sans-serif;`;
  document.body.appendChild(d);
});
r.render(scene, cam);
window.done = true;
</script></body></html>
