<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#14171d" />
  <title>Stick Shooter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div id="crosshair">
      <i class="ch t"></i><i class="ch b"></i><i class="ch l"></i><i class="ch r"></i><i class="ch dot"></i>
    </div>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
    <div id="scope" class="hidden"><div class="scope-ring"></div><div class="scope-h"></div><div class="scope-v"></div></div>
    <div id="vignette"></div>
    <div id="dmg-indicators"></div>
    <!-- Everything below is laid out at 1920x1080 and scaled to the screen (see fitUi in hud.js). -->
    <div id="hud-frame">
      <div id="killfeed"></div>
      <div id="topbar"><span id="score-me">0</span><span class="sep">KILLS</span><span id="score-deaths">0</span><span class="sep">DEATHS</span></div>
      <div id="team-score" class="hidden"></div>
      <div id="perf"><div id="fps"></div><div id="room-info" class="hidden"></div><div id="net" class="hidden"></div></div>
      <div class="hud-bl">
        <div class="money"><span>$</span><b id="money">0</b></div>
        <div class="vitals">
          <div class="vital"><svg viewBox="0 0 24 24"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg><b id="health">100</b></div>
          <div class="vital armor"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg><b id="armor">0</b><i id="helmet" title="Helmet">H</i></div>
        </div>
      </div>
      <div class="hud-br">
        <div id="weapon-name">USP</div>
        <div class="ammo"><b id="clip">12</b><span>/</span><span id="reserve">100</span></div>
        <div id="reload-bar"><i></i></div>
      </div>
      <div id="center-msg"></div>
      <div id="hint"></div>
      <div id="scoreboard" class="hidden panel"></div>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="menu-card">
      <button id="music-toggle" class="icon-btn" title="Menu music" aria-label="Mute menu music">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/><path class="cross" d="M16 9l6 6M22 9l-6 6"/></svg>
      </button>
      <h1 class="logo">STICK<span>SHOOTER</span></h1>
      <p class="tag">Early build · online play is in testing</p>
      <div class="mode-pick" role="radiogroup" aria-label="Game mode">
        <button class="mode-btn" data-mode="ffa" role="radio">FREE FOR ALL</button>
        <button class="mode-btn" data-mode="teams" role="radio">TEAMS <small><i class="dot red"></i>vs<i class="dot blue"></i></small></button>
      </div>
      <button id="play-online" class="btn primary online">PLAY ONLINE</button>
      <p id="net-status" class="net-status hidden"></p>
      <button id="play" class="btn primary">PRACTICE</button>
      <div class="row">
        <label>Bots <select id="m-bots"></select></label>
        <label>Difficulty <select id="m-diff"><option value="easy">Easy</option><option value="normal">Normal</option><option value="hard">Hard</option></select></label>
      </div>
      <button id="open-settings" class="btn">SETTINGS</button>
      <div id="controls" class="controls"></div>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="menu-card small">
      <h2>PAUSED</h2>
      <button id="resume" class="btn primary">RESUME</button>
      <button id="pause-settings" class="btn">SETTINGS</button>
      <button id="quit" class="btn">MAIN MENU</button>
    </div>
  </div>

  <div id="settings" class="screen hidden">
    <div class="menu-card settings-card">
      <h2>SETTINGS</h2>
      <div id="settings-form"></div>
      <button id="close-settings" class="btn primary">DONE</button>
    </div>
  </div>

  <div id="buymenu" class="screen hidden">
    <div class="buy-card">
      <div class="buy-head">
        <svg class="buy-logo" viewBox="0 0 48 48" aria-hidden="true"><circle cx="17" cy="9" r="6"/><path d="M17 15v15M17 30l-7 14M17 30l7 14M17 19l10 5h14M17 19l-8 9"/></svg>
        <h2 id="buy-title">Buy Menu</h2>
        <div class="buy-money">$<b id="buy-money">0</b></div>
      </div>
      <div class="buy-body">
        <div id="buy-list"></div>
        <div id="buy-info"></div>
      </div>
    </div>
  </div>

  <div id="loading" class="screen"><div class="spinner"></div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
